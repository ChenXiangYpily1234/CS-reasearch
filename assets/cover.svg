<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">CS Research — Evidence first. Reproducibility by design.</title>
  <desc id="desc">Dark navy cover showing a research workflow from paper discovery through experiment verification to manuscript and figures.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1325"/>
      <stop offset="62%" stop-color="#121e38"/>
      <stop offset="100%" stop-color="#12293b"/>
    </linearGradient>
    <linearGradient id="emphasis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a8cff"/>
      <stop offset="100%" stop-color="#66d9ca"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="410" rx="22" fill="url(#background)"/>
  <rect x="0" y="0" width="1280" height="410" rx="22" fill="url(#grid)"/>
  <circle cx="1075" cy="85" r="300" fill="#67d2d4" opacity=".055"/>
  <circle cx="1150" cy="315" r="280" fill="#6d75ea" opacity=".075"/>
  <rect x="55" y="45" width="225" height="31" rx="15.5" fill="#243658" stroke="#425c81" stroke-width="1"/>
  <circle cx="73" cy="60.5" r="4" fill="#66d9ca"/>
  <text x="89" y="66" fill="#c9d9fb" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.65" font-size="11">OPEN AGENT SKILL</text>
  <text x="55" y="169" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="69" letter-spacing="-2.7">CS Research</text>
  <rect x="58" y="193" width="286" height="5" rx="2.5" fill="url(#emphasis)"/>
  <text x="55" y="242" fill="#dce8ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Evidence first.</text>
  <text x="55" y="274" fill="#dce8ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Reproducibility by design.</text>
  <text x="56" y="331" fill="#8fa6c8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing=".3">READ  /  FREEZE  /  SCREEN  /  VERIFY  /  WRITE</text>
  <rect x="694" y="49" width="532" height="313" rx="18" fill="#121e31" fill-opacity=".9" stroke="#4a678d" stroke-opacity=".65"/>
  <rect x="716" y="69" width="488" height="45" rx="10" fill="#1d3047"/>
  <rect x="716" y="132" width="488" height="45" rx="10" fill="#1d3047"/>
  <rect x="716" y="195" width="488" height="45" rx="10" fill="#1d3047"/>
  <rect x="716" y="258" width="488" height="45" rx="10" fill="#1d3047"/>
  <path d="M741 114 V131 M741 177 V194 M741 240 V257" stroke="#66d9ca" stroke-width="2" stroke-linecap="round"/>
  <circle cx="741" cy="91.5" r="13" fill="#2a5570"/>
  <circle cx="741" cy="154.5" r="13" fill="#2a5570"/>
  <circle cx="741" cy="217.5" r="13" fill="#2a5570"/>
  <circle cx="741" cy="280.5" r="13" fill="#2a5570"/>
  <text x="741" y="95.5" text-anchor="middle" fill="#bceee8" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">01</text>
  <text x="741" y="158.5" text-anchor="middle" fill="#bceee8" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">02</text>
  <text x="741" y="221.5" text-anchor="middle" fill="#bceee8" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">03</text>
  <text x="741" y="284.5" text-anchor="middle" fill="#bceee8" font-size="11" font-weight="700" font-family="Arial, Helvetica, sans-serif">04</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="766" y="88" fill="#eef5ff" font-size="15" font-weight="700">DISCOVER</text>
    <text x="766" y="104" fill="#8dabc9" font-size="12">20–30 papers · cited evidence</text>
    <text x="766" y="151" fill="#eef5ff" font-size="15" font-weight="700">FREEZE</text>
    <text x="766" y="167" fill="#8dabc9" font-size="12">baseline · datasets · seeds · budgets</text>
    <text x="766" y="214" fill="#eef5ff" font-size="15" font-weight="700">VERIFY</text>
    <text x="766" y="230" fill="#8dabc9" font-size="12">12 methods · strict seed gates</text>
    <text x="766" y="277" fill="#eef5ff" font-size="15" font-weight="700">COMMUNICATE</text>
    <text x="766" y="293" fill="#8dabc9" font-size="12">story · review · editable figures</text>
    <text x="717" y="338" fill="#6fd3c9" font-size="11" letter-spacing="1">AUDITABLE  •  REUSABLE  •  HONEST ABOUT LIMITS</text>
  </g>
</svg>

